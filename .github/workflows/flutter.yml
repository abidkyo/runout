name: Runout CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Analyze, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build web
        run: flutter build web --release --wasm --no-web-resources-cdn

      - name: Upload web build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: runout-web
          path: build/web
          retention-days: 1
