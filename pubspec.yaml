name: runout
description: "A billiard scoring app."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  clock: ^1.1.3
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_auto_size_text: ^5.0.0
  flutter_confetti: ^0.9.2
  flutter_svg: ^2.5.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  material_ui: ^1.7.0
  meta: ^1.19.0
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.17.1
  drift_dev: ^2.35.3
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  # flutter_lints: ^6.0.0
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  launcher_icons: ^0.16.0
  shared_preferences_platform_interface: ^2.4.2
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-VariableFont_opsz,wght.ttf
