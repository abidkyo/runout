name: runout
description: "A billiard scoring app."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  clock: ^1.1.3
  flutter:
    sdk: flutter
  flutter_auto_size_text: ^5.0.0
  flutter_confetti: ^0.9.2
  freezed_annotation: ^3.1.0
  material_ui: ^1.7.0
  meta: ^1.19.0
  provider: ^6.1.5+1
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.17.1
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  # flutter_lints: ^6.0.0
  freezed: ^4.0.3
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-VariableFont_opsz,wght.ttf
